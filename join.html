<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenEd — Join a Class</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#0a0f1e 0%,#071a12 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:white;border-radius:24px;padding:44px 40px;width:460px;max-width:95vw;box-shadow:0 32px 80px rgba(0,0,0,.5);}
.logo{display:flex;align-items:center;gap:9px;margin-bottom:28px;text-decoration:none;color:#0d0d0d;}
.logo-ico{width:36px;height:36px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(14,168,122,.4);}
.logo-word{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.logo-word em{color:#0ea87a;font-style:normal;}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
p{font-size:13px;color:#6b7280;margin-bottom:28px;line-height:1.5;}
.code-inp{width:100%;padding:16px;border:2px solid #e8e8e5;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:800;letter-spacing:8px;text-transform:uppercase;text-align:center;outline:none;transition:border-color .2s;margin-bottom:16px;}
.code-inp:focus{border-color:#0ea87a;}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#0d0d0d;color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn:hover{background:#222;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:14px;display:none;}
.msg.err{background:#fff1f2;color:#dc2626;border:1px solid #fecdd3;}
.msg.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:#6b7280;text-decoration:none;}
.back:hover{color:#0d0d0d;}
#loader-state{display:none;text-align:center;padding:20px 0;color:#6b7280;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">
    <div class="logo-ico">
      <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <span class="logo-word">Zen<em>Ed</em></span>
  </a>

  <h1>Join your class</h1>
  <p>Enter the 6-letter code your teacher gave you. You must be signed in first.</p>

  <div id="notSignedIn" style="display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;font-weight:600;color:#d97706;">
    ⚠️ You need to <a href="app.html" style="color:#0ea87a;text-decoration:underline;">sign in</a> before joining a class.
  </div>

  <div id="msg" class="msg"></div>
  <input class="code-inp" id="codeInp" maxlength="6" placeholder="ABC123" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
  <button class="btn" id="joinBtn" onclick="joinClass()">Join class →</button>
  <div id="loader-state">Joining...</div>
  <a href="index.html" class="back">← Back to ZenEd</a>
</div>

<script>
const SB_URL = 'https://spkqmhrogykcbrvujgub.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwa3FtaHJvZ3lrY2JydnVqZ3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTU0OTEsImV4cCI6MjA4NzM3MTQ5MX0.00fS4NTvcC4f-mD8gRSqD1huWIdHo8Xe6UMZn8UJeb0';
let db, USER;

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
}

async function joinClass() {
  const code = document.getElementById('codeInp').value.trim().toUpperCase();
  if (code.length !== 6) { showMsg('Enter your full 6-character class code.', 'err'); return; }
  if (!USER) { showMsg('You must be signed in to join a class.', 'err'); return; }

  document.getElementById('joinBtn').style.display = 'none';
  document.getElementById('loader-state').style.display = 'block';
  document.getElementById('msg').style.display = 'none';

  // Find classroom by code
  const { data: classroom, error } = await db.from('classrooms').select('id, name, teacher_id').eq('code', code).single();

  if (error || !classroom) {
    document.getElementById('joinBtn').style.display = 'block';
    document.getElementById('loader-state').style.display = 'none';
    showMsg('Class code not found. Double-check with your teacher.', 'err');
    return;
  }

  // Check not teacher joining own class
  if (classroom.teacher_id === USER.id) {
    document.getElementById('joinBtn').style.display = 'block';
    document.getElementById('loader-state').style.display = 'none';
    showMsg('That\'s your own class — students use this page!', 'err');
    return;
  }

  // Join (upsert to avoid duplicate error)
  const { error: joinErr } = await db.from('classroom_students').upsert({
    classroom_id: classroom.id,
    student_id: USER.id
  }, { onConflict: 'classroom_id,student_id' });

  document.getElementById('joinBtn').style.display = 'block';
  document.getElementById('loader-state').style.display = 'none';

  if (joinErr) { showMsg('Error joining class. Try again.', 'err'); return; }

  showMsg(`✓ You joined "${classroom.name}"! Your teacher can now see your progress.`, 'ok');
  document.getElementById('codeInp').value = '';
  setTimeout(() => { window.location.href = 'index.html'; }, 2500);
}

window.onload = async () => {
  if (typeof supabase === 'undefined') return;
  try { db = supabase.createClient(SB_URL, SB_KEY); } catch(e) { return; }
  const { data } = await db.auth.getSession();
  USER = data?.session?.user || null;
  if (!USER) document.getElementById('notSignedIn').style.display = 'block';

  // Allow Enter key
  document.getElementById('codeInp').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinClass();
  });
};
</script>
</body>
</html>
