<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenEd — Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --teal:#0ea87a; --teal-dark:#0b8f68; --teal-light:#e6f7f2;
  --black:#0d0d0d; --white:#fff; --cream:#f8fafc;
  --gray:#64748b; --gray-light:#f1f5f9; --border:#e2e8f0;
  --red:#ef4444; --yellow:#f59e0b; --green:#10b981;
  --red-bg:#fff1f2; --yellow-bg:#fffbeb; --green-bg:#f0fdf4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--black);min-height:100vh;}

/* ── NAV ── */
.nav{height:56px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:0;position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--black);font-weight:800;font-size:17px;letter-spacing:-0.4px;margin-right:32px;}
.nav-logo-ico{width:28px;height:28px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.nav-logo em{color:var(--teal);font-style:normal;}
.nav-links{display:flex;gap:4px;flex:1;}
.nav-link{font-size:13px;font-weight:600;color:var(--gray);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .15s;}
.nav-link:hover{background:var(--gray-light);color:var(--black);}
.nav-link.active{background:var(--teal-light);color:var(--teal);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-teacher-badge{font-size:11px;font-weight:700;background:#eff6ff;color:#2563eb;padding:4px 10px;border-radius:20px;}
.btn-signout{font-size:13px;font-weight:600;padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-signout:hover{background:var(--gray-light);}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;}
#loader.hide{opacity:0;pointer-events:none;}
.loader-dots{display:flex;gap:6px;}
.ld{width:8px;height:8px;background:var(--teal);border-radius:50%;animation:dp 1.2s ease-in-out infinite;}
.ld:nth-child(2){animation-delay:.2s;}.ld:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── AUTH WALL ── */
#authWall{display:none;min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0f1e,#071a12);}
.auth-box{background:white;border-radius:24px;padding:44px 40px;width:420px;max-width:92vw;box-shadow:0 32px 80px rgba(0,0,0,.4);}
.auth-box h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.auth-box p{font-size:13px;color:var(--gray);margin-bottom:28px;}
.finp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:12px;}
.finp:focus{border-color:var(--teal);}
.btn-main{width:100%;padding:13px;border:none;border-radius:10px;background:var(--black);color:white;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-main:hover{background:#222;}
.auth-err{font-size:13px;color:var(--red);margin-bottom:10px;display:none;}

/* ── LAYOUT ── */
#app{display:none;}
.layout{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:240px;background:white;border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.sb-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);padding:0 10px;margin:16px 0 8px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.sb-item:hover{background:var(--gray-light);color:var(--black);}
.sb-item.on{background:var(--teal-light);color:var(--teal);}
.sb-item .ico{font-size:16px;width:20px;text-align:center;}
.sb-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--gray-light);color:var(--gray);padding:2px 7px;border-radius:20px;}
.sb-item.on .sb-count{background:rgba(14,168,122,.15);color:var(--teal);}
.content{flex:1;padding:32px 36px;max-width:1100px;}

/* ── PAGE HEADER ── */
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;}
.page-hd-left h1{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px;}
.page-hd-left p{font-size:13px;color:var(--gray);}
.btn-primary{padding:11px 20px;background:var(--teal);color:white;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;}
.btn-primary:hover{background:var(--teal-dark);}
.btn-secondary{padding:10px 18px;background:white;color:var(--black);border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-secondary:hover{border-color:var(--black);}

/* ── STAT CARDS ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:white;border:1px solid var(--border);border-radius:16px;padding:20px 22px;}
.stat-num{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:2px;}
.stat-lbl{font-size:12px;color:var(--gray);font-weight:600;}
.stat-card.green .stat-num{color:var(--green);}
.stat-card.yellow .stat-num{color:var(--yellow);}
.stat-card.red .stat-num{color:var(--red);}

/* ── CLASS CODE CARD ── */
.code-card{background:linear-gradient(135deg,#0a0f1e,#0f2d1e);border-radius:16px;padding:24px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.code-card-left h3{font-size:13px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.code-pill{font-size:32px;font-weight:800;color:white;letter-spacing:6px;font-family:monospace;}
.code-sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px;}
.btn-copy{padding:10px 18px;background:rgba(255,255,255,.1);color:white;border:1.5px solid rgba(255,255,255,.2);border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-copy:hover{background:rgba(255,255,255,.2);}
.btn-copy.copied{background:var(--teal);border-color:var(--teal);}

/* ── STUDENT TABLE ── */
.table-wrap{background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.table-title{font-size:15px;font-weight:700;}
.search-inp{padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;outline:none;width:220px;transition:border-color .2s;}
.search-inp:focus{border-color:var(--teal);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:11px 16px;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;background:var(--gray-light);border-bottom:1px solid var(--border);}
td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
.student-name{font-weight:700;color:var(--black);}
.student-email{font-size:11px;color:var(--gray);margin-top:1px;}
.readiness-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.readiness-pill.green{background:var(--green-bg);color:#059669;}
.readiness-pill.yellow{background:var(--yellow-bg);color:#d97706;}
.readiness-pill.red{background:var(--red-bg);color:#dc2626;}
.readiness-pill.none{background:var(--gray-light);color:var(--gray);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.subject-pills{display:flex;gap:4px;flex-wrap:wrap;}
.btn-view{padding:5px 12px;border:1.5px solid var(--border);border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:white;transition:all .15s;}
.btn-view:hover{border-color:var(--teal);color:var(--teal);}
.empty-row td{text-align:center;padding:48px;color:var(--gray);}

/* ── STUDENT DETAIL MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:white;border-radius:20px;width:720px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:white;z-index:10;}
.modal-hd h2{font-size:18px;font-weight:800;}
.modal-close{width:32px;height:32px;border:none;background:var(--gray-light);border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:24px 28px;}
.modal-section{margin-bottom:24px;}
.modal-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:12px;}
.unit-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;margin-bottom:6px;border:1px solid var(--border);}
.unit-row.green{background:var(--green-bg);border-color:#bbf7d0;}
.unit-row.yellow{background:var(--yellow-bg);border-color:#fde68a;}
.unit-row.red{background:var(--red-bg);border-color:#fecdd3;}
.unit-name{font-size:13px;font-weight:600;}
.unit-grade{font-size:13px;font-weight:800;}
.quiz-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.quiz-row:last-child{border-bottom:none;}
.quiz-pct{font-weight:800;}
.quiz-pct.high{color:var(--green);}
.quiz-pct.mid{color:var(--yellow);}
.quiz-pct.low{color:var(--red);}
.no-data{font-size:13px;color:var(--gray);padding:16px;text-align:center;background:var(--gray-light);border-radius:10px;}

/* ── NEW CLASS MODAL ── */
.modal-form .fgroup{margin-bottom:16px;}
.modal-form label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--gray);}
.modal-form .finp{margin-bottom:0;}

/* ── OVERVIEW CHARTS ── */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.overview-card{background:white;border:1px solid var(--border);border-radius:16px;padding:22px;}
.ov-title{font-size:14px;font-weight:700;margin-bottom:16px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.bar-label{font-size:12px;font-weight:600;width:100px;flex-shrink:0;}
.bar-track{flex:1;height:8px;background:var(--gray-light);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .8s ease;}
.bar-fill.green{background:var(--green);}
.bar-fill.yellow{background:var(--yellow);}
.bar-fill.red{background:var(--red);}
.bar-pct{font-size:12px;font-weight:700;width:36px;text-align:right;flex-shrink:0;}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.subj-mini{padding:12px 14px;border-radius:10px;border:1px solid var(--border);}
.subj-mini-name{font-size:11px;font-weight:700;color:var(--gray);margin-bottom:6px;}
.subj-mini-bars{display:flex;gap:3px;height:6px;}
.subj-mini-bar{flex:1;border-radius:2px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{background:#15803d;color:white;}
#toast.error{background:var(--red);color:white;}
#toast.info{background:var(--black);color:white;}

@media(max-width:900px){
  .sidebar{display:none;}
  .content{padding:20px 16px;}
  .stats-row{grid-template-columns:1fr 1fr;}
  .overview-grid{grid-template-columns:1fr;}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page{animation:fadeIn .2s ease;}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
</div>
<div id="toast"></div>

<!-- AUTH WALL — shown if not logged in -->
<div id="authWall">
  <div class="auth-box">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;">
      <div style="width:32px;height:32px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:9px;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <span style="font-weight:800;font-size:18px;">Zen<em style="color:#0ea87a;font-style:normal;">Ed</em> Teacher</span>

    <p style="font-size:12px;color:#6b7280;margin-top:14px;text-align:center;">Don't have a teacher account? <a href="app.html" style="color:#0ea87a;font-weight:600;">Create one →</a></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-ico">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      Zen<em>Ed</em>
    </a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="teacher.html" class="nav-link active">My Class</a>
      <a href="resources.html" class="nav-link">Resources</a>
    </div>
    <div class="nav-right">
      <span class="nav-teacher-badge">👩‍🏫 Teacher</span>
      <span id="navName" style="font-size:13px;color:var(--gray);font-weight:600;"></span>
      <button class="btn-signout" onclick="signOut()">Sign out</button>
    </div>
  </nav>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sb-label">Views</div>
      <button class="sb-item on" onclick="showPage('overview')" id="sb-overview">
        <span class="ico">📊</span> Overview
      </button>
      <button class="sb-item" onclick="showPage('students')" id="sb-students">
        <span class="ico">👥</span> All Students
        <span class="sb-count" id="studentCountBadge">0</span>
      </button>
      <button class="sb-item" onclick="showPage('atRisk')" id="sb-atRisk">
        <span class="ico">🚨</span> Needs Help
        <span class="sb-count" id="atRiskBadge">0</span>
      </button>
      <button class="sb-item" onclick="showPage('quizzes')" id="sb-quizzes">
        <span class="ico">📝</span> Quiz Scores
      </button>
      <div class="sb-label">Class</div>
      <button class="sb-item" onclick="showPage('classCode')" id="sb-classCode">
        <span class="ico">🔑</span> Class Code
      </button>
      <button class="sb-item" onclick="showPage('settings')" id="sb-settings">
        <span class="ico">⚙️</span> Settings
      </button>

    <!-- CONTENT -->
    <div class="content" id="mainContent"></div>

</div>

<!-- STUDENT DETAIL MODAL -->
<div class="modal-bg" id="studentModal">
  <div class="modal">
    <div class="modal-hd">
      <h2 id="modalStudentName">Student Detail</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const SB_URL = 'https://spkqmhrogykcbrvujgub.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwa3FtaHJvZ3lrY2JydnVqZ3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTU0OTEsImV4cCI6MjA4NzM3MTQ5MX0.00fS4NTvcC4f-mD8gRSqD1huWIdHo8Xe6UMZn8UJeb0';

let db, USER, CLASSROOM, STUDENTS = [], GRADES = {}, READINESS = {}, QUIZZES = {};

function showAuth() {
  document.getElementById('loader').classList.add('hide');
  document.getElementById('authWall').style.display = 'flex';
}
function showApp() {
  document.getElementById('loader').classList.add('hide');
  document.getElementById('authWall').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  setTimeout(() => el.className = '', 3000);
}

// ── SIGN IN ──
async function doSignIn() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Please enter email and password.'; err.style.display = 'block'; return; }
  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  await loadTeacherData(data.user);
}
async function signOut() {
  await db.auth.signOut();
  location.reload();
}

// ── LOAD ALL DATA ──
async function loadTeacherData(user) {
  USER = user;
  document.getElementById('navName').textContent = user.email.split('@')[0];

  // Get or create classroom
  let { data: classes } = await db.from('classrooms').select('*').eq('teacher_id', user.id);
  if (!classes?.length) {
    // Auto-create a default classroom
    const { data: newClass } = await db.from('classrooms').insert({
      teacher_id: user.id,
      name: 'My Class',
      subject: 'All Subjects'
    }).select().single();
    CLASSROOM = newClass;
  } else {
    CLASSROOM = classes[0];
  }

  // Get enrolled students
  const { data: enrollments } = await db.from('classroom_students')
    .select('student_id, joined_at')
    .eq('classroom_id', CLASSROOM.id);

  if (enrollments?.length) {
    const studentIds = enrollments.map(e => e.student_id);

    // Get profiles
    const { data: profiles } = await db.from('profiles')
      .select('id, full_name, email, role, created_at')
      .in('id', studentIds);

    STUDENTS = (profiles || []).map(p => ({
      ...p,
      joined_at: enrollments.find(e => e.student_id === p.id)?.joined_at
    }));

    // Get readiness scores
    const { data: readiness } = await db.from('readiness_scores')
      .select('user_id, subject, score, level, updated_at')
      .in('user_id', studentIds);

    READINESS = {};
    (readiness || []).forEach(r => {
      if (!READINESS[r.user_id]) READINESS[r.user_id] = {};
      READINESS[r.user_id][r.subject] = r;
    });

    // Get grade entries
    const { data: grades } = await db.from('grade_entries')
      .select('user_id, subject, unit_name, grade_letter, grade_num, readiness, created_at')
      .in('user_id', studentIds)
      .order('created_at', { ascending: false });

    GRADES = {};
    (grades || []).forEach(g => {
      if (!GRADES[g.user_id]) GRADES[g.user_id] = [];
      GRADES[g.user_id].push(g);
    });

    // Get quiz attempts
    const { data: quizzes } = await db.from('quiz_attempts')
      .select('user_id, subject, score, total, pct, created_at')
      .in('user_id', studentIds)
      .order('created_at', { ascending: false });

    QUIZZES = {};
    (quizzes || []).forEach(q => {
      if (!QUIZZES[q.user_id]) QUIZZES[q.user_id] = [];
      QUIZZES[q.user_id].push(q);
    });
  }

  // Update badges
  document.getElementById('studentCountBadge').textContent = STUDENTS.length;
  const atRisk = STUDENTS.filter(s => isAtRisk(s.id)).length;
  document.getElementById('atRiskBadge').textContent = atRisk;

  showApp();
  showPage('overview');
}

function isAtRisk(userId) {
  const r = READINESS[userId];
  if (!r) return false;
  return Object.values(r).some(v => v.level === 'red');
}

function getOverallLevel(userId) {
  const r = READINESS[userId];
  if (!r || !Object.keys(r).length) return 'none';
  const levels = Object.values(r).map(v => v.level);
  if (levels.some(l => l === 'red')) return 'red';
  if (levels.every(l => l === 'green')) return 'green';
  return 'yellow';
}

// ── PAGES ──
function showPage(name) {
  document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('on'));
  const sb = document.getElementById('sb-' + name);
  if (sb) sb.classList.add('on');

  const content = document.getElementById('mainContent');
  const pages = { overview: pageOverview, students: pageStudents, atRisk: pageAtRisk, quizzes: pageQuizzes, classCode: pageClassCode, settings: pageSettings };
  content.innerHTML = '';
  if (pages[name]) pages[name](content);
}

        </div>

          <div class="stat-lbl">Needs work ⚠️</div>
        </div>
        <div class="stat-card red">
          <div class="stat-num">${red}</div>
          <div class="stat-lbl">At risk 🚨</div>

      </div>

      <div class="overview-grid">
        <div class="overview-card">

              <div class="bar-track"><div class="bar-fill yellow" style="width:${Math.round(yellow/total*100)}%"></div></div>
              <div class="bar-pct" style="color:var(--yellow)">${Math.round(yellow/total*100)}%</div>
            </div>
            <div class="bar-row">
              <div class="bar-label" style="color:var(--red)">At risk</div>
              <div class="bar-track"><div class="bar-fill red" style="width:${Math.round(red/total*100)}%"></div></div>
              <div class="bar-pct" style="color:var(--red)">${Math.round(red/total*100)}%</div>
            </div>
            <div class="bar-row">

// ── STUDENTS PAGE ──
function pageStudents(el, filter = null) {
  let students = [...STUDENTS];
  if (filter === 'red') students = students.filter(s => isAtRisk(s.id));

  el.innerHTML = `
    <div class="page">
      <div class="page-hd">
        <div class="page-hd-left">
          <h1>${filter === 'red' ? '🚨 Needs Help' : '👥 All Students'}</h1>
          <p>${students.length} student${students.length !== 1 ? 's' : ''}</p>
        </div>
        <input class="search-inp" id="studentSearch" placeholder="Search by name or email…" oninput="filterStudents(this.value)">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Student</th>
            <th>Overall</th>
            <th>Living Env.</th>
            <th>Algebra I</th>
            <th>ELA</th>
            <th>US History</th>
            <th>Quiz avg</th>
            <th></th>
          </tr></thead>
          <tbody id="studentTbody">
            ${renderStudentRows(students)}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderStudentRows(students) {
  if (!students.length) return `<tr class="empty-row"><td colspan="8">No students found</td></tr>`;
  const subjects = ['biology','algebra','ela','history'];
  return students.map(s => {
    const level = getOverallLevel(s.id);
    const quizzes = QUIZZES[s.id] || [];
    const avgQuiz = quizzes.length ? Math.round(quizzes.reduce((a,q) => a + (q.pct||0), 0) / quizzes.length) : null;
    return `<tr>
      <td><div class="student-name">${s.full_name || '—'}</div><div class="student-email">${s.email||''}</div></td>
      <td><span class="readiness-pill ${level}"><span class="dot"></span>${level === 'green' ? 'On track' : level === 'yellow' ? 'Needs work' : level === 'red' ? 'At risk' : 'No data'}</span></td>
      ${subjects.map(subj => {
        const r = READINESS[s.id]?.[subj];
        return `<td>${r ? `<span class="readiness-pill ${r.level}"><span class="dot"></span>${r.score}%</span>` : '<span style="color:var(--gray);font-size:12px;">—</span>'}</td>`;
      }).join('')}
      <td style="font-weight:700;color:${avgQuiz===null?'var(--gray)':avgQuiz>=80?'var(--green)':avgQuiz>=60?'var(--yellow)':'var(--red)'};">${avgQuiz !== null ? avgQuiz + '%' : '—'}</td>
      <td><button class="btn-view" onclick="openStudentModal('${s.id}')">View →</button></td>
    </tr>`;
  }).join('');
}

function filterStudents(q) {
  const lower = q.toLowerCase();
  const filtered = STUDENTS.filter(s =>
    (s.full_name||'').toLowerCase().includes(lower) ||
    (s.email||'').toLowerCase().includes(lower)
  );
  document.getElementById('studentTbody').innerHTML = renderStudentRows(filtered);
}

function copyCode() {
  navigator.clipboard.writeText(CLASSROOM?.code || '').then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy code'; btn.classList.remove('copied'); }, 2000);
  });
}

async function saveClassName() {
  const name = document.getElementById('classNameInp').value.trim();
  if (!name) return;
  const { error } = await db.from('classrooms').update({ name }).eq('id', CLASSROOM.id);
  if (!error) { CLASSROOM.name = name; toast('Class name updated ✓', 'success'); }
  else toast('Error saving', 'error');
}

// ── STUDENT DETAIL MODAL ──
function openStudentModal(userId) {
  const student = STUDENTS.find(s => s.id === userId);
  if (!student) return;

  document.getElementById('modalStudentName').textContent = student.full_name || student.email;
  document.getElementById('studentModal').classList.add('show');

  const grades = GRADES[userId] || [];
  const quizzes = QUIZZES[userId] || [];
  const readiness = READINESS[userId] || {};
  const subjectLabels = { biology:'Living Environment', algebra:'Algebra I', ela:'ELA', history:'US History' };
  const subjectLabelsQuiz = { bio:'Biology', alg:'Algebra', ela:'ELA', ush:'US History', sat:'SAT', mock:'Mock' };

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Contact</div>
      <div style="font-size:14px;color:var(--gray);">${student.email || '—'}</div>
      <div style="font-size:12px;color:var(--gray);margin-top:2px;">Joined ${new Date(student.joined_at).toLocaleDateString()}</div>
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Readiness by subject</div>
      ${Object.keys(readiness).length === 0 ? '<div class="no-data">Student hasn\'t entered grades yet</div>' :
        Object.entries(readiness).map(([subj, r]) => `
          <div class="unit-row ${r.level}">
            <div class="unit-name">${subjectLabels[subj] || subj}</div>
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="readiness-pill ${r.level}"><span class="dot"></span>${r.level === 'green' ? 'On track' : r.level === 'yellow' ? 'Needs work' : 'At risk'}</span>
              <span class="unit-grade">${r.score}%</span>
            </div>
          </div>
        `).join('')
      }
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Grade entries (${grades.length})</div>
      ${grades.length === 0 ? '<div class="no-data">No grades entered yet</div>' :
        grades.slice(0, 10).map(g => `
          <div class="unit-row ${g.readiness || 'none'}">
            <div>
              <div class="unit-name">${g.unit_name || '—'}</div>
              <div style="font-size:11px;color:var(--gray);">${subjectLabels[g.subject] || g.subject}</div>
            </div>
            <div class="unit-grade">${g.grade_letter || g.grade_num || '—'}</div>
          </div>
        `).join('')
      }
    </div>

    <div class="modal-section">
      <div class="modal-section-title">Quiz history (${quizzes.length} attempts)</div>
      ${quizzes.length === 0 ? '<div class="no-data">No quizzes taken yet</div>' :
        `<div style="background:var(--gray-light);border-radius:10px;padding:4px 14px;">
          ${quizzes.slice(0,8).map(q => `
            <div class="quiz-row">
              <span>${subjectLabelsQuiz[q.subject] || q.subject}</span>
              <span>${new Date(q.created_at).toLocaleDateString()}</span>
              <span class="quiz-pct ${(q.pct||0)>=80?'high':(q.pct||0)>=60?'mid':'low'}">${q.pct || Math.round(q.score/q.total*100)}%</span>
            </div>
          `).join('')}
        </div>`
      }
    </div>`;
}

function closeModal() {
  document.getElementById('studentModal').classList.remove('show');
}

// ── INIT ──
window.onload = async () => {
  if (typeof supabase === 'undefined') {
    document.getElementById('loader').classList.add('hide');
    document.getElementById('authWall').style.display = 'flex';
    document.querySelector('.auth-box p').textContent = 'Could not load authentication. Check your connection.';
    return;
  }

  try { db = supabase.createClient(SB_URL, SB_KEY); } catch(e) { showAuth(); return; }

  const timeout = setTimeout(showAuth, 5000);
  try {
    const { data } = await db.auth.getSession();
    clearTimeout(timeout);
    if (data?.session?.user) {
      await loadTeacherData(data.session.user);
    } else {
      showAuth();
    }
  } catch(e) { clearTimeout(timeout); showAuth(); }

  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { location.reload(); }
  });
};

// Close modal on background click
document.getElementById('studentModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
