<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenEd — Teacher Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#0ea87a;--teal-dark:#0b8f68;--teal-light:#e6f7f2;
  --black:#0d0d0d;--white:#fff;--cream:#f8fafc;
  --gray:#64748b;--gray-light:#f1f5f9;--border:#e2e8f0;
  --red:#ef4444;--yellow:#f59e0b;--green:#10b981;
  --red-bg:#fff1f2;--yellow-bg:#fffbeb;--green-bg:#f0fdf4;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--black);min-height:100vh;}

/* ── LOADER ── */
#loader{position:fixed;inset:0;background:#0a0f1e;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
#loader.hide{opacity:0;pointer-events:none;}
.loader-logo{width:52px;height:52px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:14px;display:flex;align-items:center;justify-content:center;animation:lp 2s ease-in-out infinite;box-shadow:0 8px 32px rgba(14,168,122,.4);}
@keyframes lp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.loader-dots{display:flex;gap:6px;margin-top:16px;}
.ld{width:6px;height:6px;background:#0ea87a;border-radius:50%;animation:dp 1.2s ease-in-out infinite;}
.ld:nth-child(2){animation-delay:.2s;}.ld:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── AUTH SCREEN ── */
#authScreen{
  display:none;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a0f1e 0%,#0f2d1e 100%);
  padding:20px;position:relative;overflow:hidden;
}
#authScreen::before{
  content:'';position:absolute;width:600px;height:600px;
  background:radial-gradient(circle,rgba(14,168,122,.1) 0%,transparent 70%);
  top:-100px;left:-100px;pointer-events:none;
}
.auth-wrap{width:100%;max-width:460px;position:relative;z-index:10;}
.auth-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.auth-logo{display:flex;align-items:center;gap:9px;text-decoration:none;color:white;}
.auth-logo-ico{width:34px;height:34px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(14,168,122,.4);}
.auth-logo-word{font-size:20px;font-weight:800;letter-spacing:-.4px;}
.auth-logo-word em{color:#0ea87a;font-style:normal;}
.auth-back{font-size:13px;font-weight:600;color:rgba(255,255,255,.4);text-decoration:none;transition:color .2s;}
.auth-back:hover{color:white;}
.auth-card{background:white;border-radius:24px;padding:40px;box-shadow:0 32px 80px rgba(0,0,0,.5);animation:slideUp .4s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.auth-badge{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;color:#2563eb;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:14px;}
.auth-h{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--gray);margin-bottom:24px;line-height:1.5;}
.tab-row{display:flex;background:var(--gray-light);border-radius:10px;padding:3px;margin-bottom:22px;}
.tab-btn{flex:1;padding:9px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;color:var(--gray);transition:all .2s;}
.tab-btn.on{background:white;color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.fgroup{margin-bottom:13px;}
.flbl{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#374151;letter-spacing:.3px;}
.finp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;color:var(--black);outline:none;transition:all .2s;background:white;}
.finp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,168,122,.08);}
.invite-wrap{position:relative;}
.invite-wrap .finp{padding-right:80px;letter-spacing:2px;font-weight:700;font-family:monospace;font-size:15px;}
.invite-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--gray);cursor:pointer;background:var(--gray-light);padding:3px 8px;border-radius:6px;}
.btn-main{width:100%;padding:13px;border:none;border-radius:10px;background:var(--black);color:white;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:2px;}
.btn-main:hover{background:#1e1e1e;}
.btn-main:disabled{opacity:.5;cursor:not-allowed;}
.auth-msg{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}
.auth-msg.err{background:var(--red-bg);color:var(--red);border:1px solid #fecdd3;}
.auth-msg.ok{background:var(--green-bg);color:#15803d;border:1px solid #bbf7d0;}
.auth-footer{text-align:center;margin-top:18px;font-size:12px;color:var(--gray);}
.auth-footer a{color:var(--teal);text-decoration:none;font-weight:600;}

/* ── INVITE LOCKED STATE ── */
.invite-gate{background:var(--gray-light);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;}
.invite-gate.show{display:block;}
.invite-gate-title{font-size:13px;font-weight:700;margin-bottom:6px;}
.invite-gate-sub{font-size:12px;color:var(--gray);}

/* ── NAV ── */
.nav{height:56px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:100;}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--black);font-weight:800;font-size:17px;letter-spacing:-.4px;margin-right:28px;}
.nav-logo-ico{width:27px;height:27px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.nav-logo em{color:var(--teal);font-style:normal;}
.nav-links{display:flex;gap:2px;flex:1;}
.nav-link{font-size:13px;font-weight:600;color:var(--gray);text-decoration:none;padding:6px 12px;border-radius:8px;transition:all .15s;border:none;background:none;cursor:pointer;font-family:inherit;}
.nav-link:hover{background:var(--gray-light);color:var(--black);}
.nav-link.on{background:var(--teal-light);color:var(--teal);}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
.teacher-badge{font-size:11px;font-weight:700;background:#eff6ff;color:#2563eb;padding:4px 10px;border-radius:20px;}
.nav-name{font-size:13px;font-weight:600;color:var(--gray);}
.btn-out{font-size:13px;font-weight:600;padding:6px 14px;border:1.5px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-out:hover{background:var(--gray-light);}

/* ── LAYOUT ── */
#appScreen{display:none;}
.layout{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:220px;background:white;border-right:1px solid var(--border);padding:16px 10px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.sb-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);padding:0 8px;margin:16px 0 8px;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--gray);transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.sb-item:hover{background:var(--gray-light);color:var(--black);}
.sb-item.on{background:var(--teal-light);color:var(--teal);}
.sb-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--gray-light);color:var(--gray);padding:2px 7px;border-radius:20px;}
.sb-item.on .sb-count{background:rgba(14,168,122,.15);color:var(--teal);}
.content{flex:1;padding:28px 32px;}

/* ── CONTENT COMPONENTS ── */
.page{animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--gray);margin-bottom:24px;line-height:1.6;}
.card{background:white;border-radius:16px;padding:22px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px;}
.card-head{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:7px;}
.section{background:white;border-radius:16px;padding:22px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px;}
.sec-head{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
.irow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.irow .finp{flex:1;min-width:140px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;background:var(--gray-light);font-weight:700;font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;}
td{padding:11px 12px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafafa;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-weight:700;font-size:11px;}
.badge.g{background:rgba(16,185,129,.1);color:#059669;}
.badge.y{background:rgba(245,158,11,.1);color:#d97706;}
.badge.r{background:rgba(239,68,68,.1);color:#dc2626;}
.empty-box{text-align:center;padding:40px 20px;color:var(--gray);}
.empty-box h3{font-size:16px;font-weight:700;color:var(--black);margin-bottom:6px;}
.empty-box p{font-size:13px;line-height:1.6;}
.btn-black{padding:10px 20px;background:var(--black);color:white;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-black:hover{background:#1e1e1e;}
.btn-teal{padding:10px 20px;background:var(--teal);color:white;border:none;border-radius:9px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-teal:hover{background:var(--teal-dark);}
.rec{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.rec:last-child{border-bottom:none;}
.rec-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.rec-topic{font-size:14px;font-weight:700;margin-bottom:2px;}
.rec-detail{font-size:12px;color:var(--gray);}

/* ── CODE DISPLAY ── */
.code-block{background:var(--black);color:white;padding:14px 20px;border-radius:12px;font-size:26px;font-weight:800;letter-spacing:6px;font-family:monospace;display:inline-block;margin-bottom:8px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{background:#15803d;color:white;}
#toast.error{background:var(--red);color:white;}
#toast.info{background:var(--black);color:white;}

@media(max-width:800px){
  .sidebar{display:none;}
  .content{padding:16px;}
  .g2,.g3{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="loader">
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="loader-logo">
      <svg viewBox="0 0 24 24" fill="none" width="26" height="26"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <div class="loader-dots"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
  </div>
</div>

<div id="toast"></div>

<!-- ══ AUTH SCREEN ══ -->
<div id="authScreen">
  <div class="auth-wrap">
    <div class="auth-top">
      <a href="index.html" class="auth-logo">
        <div class="auth-logo-ico">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <span class="auth-logo-word">Zen<em>Ed</em></span>
      </a>
      <a href="index.html" class="auth-back">← Back to student site</a>
    </div>

    <div class="auth-card">
      <div class="auth-badge">👩‍🏫 Teacher Portal</div>
      <h1 class="auth-h">Teacher sign in</h1>
      <p class="auth-sub">Track your students' readiness, grades, and quiz scores in one place.</p>

      <div class="tab-row">
        <button class="tab-btn on" id="tabIn" onclick="switchTab('in')">Sign In</button>
        <button class="tab-btn" id="tabUp" onclick="switchTab('up')">Create Account</button>
      </div>

      <div id="authMsg" class="auth-msg"></div>

      <!-- SIGN IN -->
      <div id="formIn">
        <div class="fgroup">
          <label class="flbl">Email</label>
          <input class="finp" id="inEmail" type="email" placeholder="you@school.edu" autocomplete="email">
        </div>
        <div class="fgroup">
          <label class="flbl">Password</label>
          <input class="finp" id="inPass" type="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <button class="btn-main" id="inBtn" onclick="doSignIn()">Sign In →</button>
      </div>

      <!-- SIGN UP -->
      <div id="formUp" style="display:none;">
        <div class="fgroup">
          <label class="flbl">Full name</label>
          <input class="finp" id="upName" type="text" placeholder="Ms. Johnson" autocomplete="name">
        </div>
        <div class="fgroup">
          <label class="flbl">Email</label>
          <input class="finp" id="upEmail" type="email" placeholder="you@school.edu" autocomplete="email">
        </div>
        <div class="fgroup">
          <label class="flbl">Password</label>
          <input class="finp" id="upPass" type="password" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="fgroup">
          <label class="flbl">Teacher invite code <span style="color:var(--gray);font-weight:500;">(get this from ZenEd)</span></label>
          <div class="invite-wrap">
            <input class="finp" id="upCode" type="password" placeholder="••••••••••" autocomplete="off" oninput="checkInviteCode()">
            <span class="invite-eye" onclick="toggleCodeVis()">show</span>
          </div>
          <div id="codeStatus" style="font-size:12px;margin-top:5px;display:none;"></div>
        </div>
        <button class="btn-main" id="upBtn" onclick="doSignUp()" disabled>Create Teacher Account →</button>
        <p style="font-size:12px;color:var(--gray);margin-top:10px;">Don't have an invite code? <a href="mailto:kunal@example.com" style="color:var(--teal);font-weight:600;">Request one →</a></p>
      </div>

      <div class="auth-footer">
        Looking for the student site? <a href="index.html">Go here →</a>
      </div>
    </div>
  </div>
</div>

<!-- ══ APP SCREEN ══ -->
<div id="appScreen">
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-ico">
        <svg viewBox="0 0 24 24" fill="none" width="13" height="13"><path d="M12 3L4 8V16L12 21L20 16V8L12 3Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 11L12 15L16 11" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V15" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      Zen<em>Ed</em>
    </a>
    <div class="nav-links">
      <button class="nav-link on" id="nb-overview" onclick="goPage('overview')">📊 Overview</button>
      <button class="nav-link" id="nb-students" onclick="goPage('students')">👥 Students <span id="studentCount" style="font-size:11px;background:var(--gray-light);padding:2px 7px;border-radius:20px;margin-left:3px;font-weight:700;">0</span></button>
      <button class="nav-link" id="nb-classrooms" onclick="goPage('classrooms')">🏫 Class Code</button>
    </div>
    <div class="nav-right">
      <span class="teacher-badge">👩‍🏫 Teacher</span>
      <span class="nav-name" id="navName"></span>
      <button class="btn-out" onclick="doSignOut()">Sign out</button>
    </div>
  </nav>
  <div class="layout">
    <div class="content" id="mainContent" style="max-width:1000px;"></div>
  </div>
</div>

<script>
// ── CONFIG ──
const SB_URL = 'https://spkqmhrogykcbrvujgub.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwa3FtaHJvZ3lrY2JydnVqZ3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTU0OTEsImV4cCI6MjA4NzM3MTQ5MX0.00fS4NTvcC4f-mD8gRSqD1huWIdHo8Xe6UMZn8UJeb0';
const TEACHER_INVITE_CODE = 'ZENED2025'; // Change this to rotate the invite code

let db, USER, PROFILE;
// (state vars declared above)

// ── UTILS ──
function H(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type='info'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='show '+type;
  setTimeout(()=>el.className='',3200);
}
function showMsg(msg,type='err'){
  const el=document.getElementById('authMsg');
  el.textContent=msg; el.className='auth-msg '+type; el.style.display='block';
}
function clearMsg(){ document.getElementById('authMsg').style.display='none'; }

// ── TAB SWITCH ──
function switchTab(t){
  document.getElementById('tabIn').classList.toggle('on',t==='in');
  document.getElementById('tabUp').classList.toggle('on',t==='up');
  document.getElementById('formIn').style.display=t==='in'?'block':'none';
  document.getElementById('formUp').style.display=t==='up'?'block':'none';
  clearMsg();
}

// ── INVITE CODE CHECK ──
function checkInviteCode(){
  const val=document.getElementById('upCode').value.trim().toUpperCase();
  const status=document.getElementById('codeStatus');
  const btn=document.getElementById('upBtn');
  if(!val){ status.style.display='none'; btn.disabled=true; return; }
  if(val===TEACHER_INVITE_CODE){
    status.textContent='✓ Valid invite code'; status.style.display='block'; status.style.color='#15803d';
    btn.disabled=false;
  } else {
    status.textContent='✗ Invalid code'; status.style.display='block'; status.style.color='var(--red)';
    btn.disabled=true;
  }
}

function toggleCodeVis(){
  const inp=document.getElementById('upCode');
  const eye=document.querySelector('.invite-eye');
  if(inp.type==='password'){ inp.type='text'; eye.textContent='hide'; }
  else { inp.type='password'; eye.textContent='show'; }
}

// ── AUTH ACTIONS ──
async function doSignIn(){
  const email=document.getElementById('inEmail').value.trim();
  const pass=document.getElementById('inPass').value;
  if(!email||!pass){ showMsg('Please fill in all fields.'); return; }
  const btn=document.getElementById('inBtn');
  btn.disabled=true; btn.textContent='Signing in…';
  const{data,error}=await db.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent='Sign In →';
  if(error){ showMsg(error.message); return; }
  await enterApp(data.user);
}

async function doSignUp(){
  const name=document.getElementById('upName').value.trim();
  const email=document.getElementById('upEmail').value.trim();
  const pass=document.getElementById('upPass').value;
  const code=document.getElementById('upCode').value.trim().toUpperCase();
  if(!name||!email||!pass){ showMsg('Please fill in all fields.'); return; }
  if(code!==TEACHER_INVITE_CODE){ showMsg('Invalid invite code.'); return; }
  if(pass.length<8){ showMsg('Password must be at least 8 characters.'); return; }
  const btn=document.getElementById('upBtn');
  btn.disabled=true; btn.textContent='Creating account…';
  const{data,error}=await db.auth.signUp({
    email,password:pass,
    options:{data:{full_name:name,role:'teacher'}}
  });
  btn.disabled=false; btn.textContent='Create Teacher Account →';
  if(error){ showMsg(error.message); return; }
  // Upsert profile with teacher role
  await db.from('profiles').upsert({
    id:data.user.id, full_name:name, email,role:'teacher'
  },{onConflict:'id'});
  showMsg('Account created! ✓ Welcome to ZenEd Teacher.','ok');
  setTimeout(()=>enterApp(data.user),1200);
}

async function doSignOut(){
  await db.auth.signOut();
  location.reload();
}

// ── ENTER APP ──
async function enterApp(user){
  USER=user;
  const{data:p}=await db.from('profiles').select('*').eq('id',user.id).single();
  PROFILE=p||{id:user.id,email:user.email,full_name:'Teacher',role:'teacher'};
  // Enforce teacher role — if student accidentally lands here, block
  if(PROFILE.role==='student'){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('authScreen').style.display='flex';
    showMsg('This portal is for teachers only. Students sign in at the main site.','err');
    await db.auth.signOut();
    return;
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('loader').classList.add('hide');
  document.getElementById('navName').textContent=PROFILE.full_name||user.email.split('@')[0];
  await loadTeacherData();
  goPage('overview');
}

// ── NAV ──
function goPage(name){
  ['overview','students','classrooms'].forEach(n=>{
    document.getElementById('nb-'+n)?.classList.toggle('on',n===name);
  });
  const pages={overview:pgOverview,students:pgStudents,classrooms:pgClassrooms};
  if(pages[name]) pages[name]();
}

function set(html){ document.getElementById('mainContent').innerHTML=html; }

// Global teacher data cache
// (state vars declared above)

async function loadTeacherData(){
  // Get classrooms
  const{data:rooms}=await db.from('classrooms').select('*, classroom_students(student_id)').eq('teacher_id',USER.id);
  T_ROOMS=rooms||[];
  if(!T_ROOMS.length) return;

  const studentIds=[...new Set(T_ROOMS.flatMap(r=>r.classroom_students.map(s=>s.student_id)))];
  if(!studentIds.length) return;

  // Profiles
  const{data:profiles}=await db.from('profiles').select('id,full_name,email,created_at').in('id',studentIds);
  T_STUDENTS=profiles||[];

  // Readiness scores
  const{data:readiness}=await db.from('readiness_scores').select('user_id,subject,score,level,updated_at').in('user_id',studentIds);
  T_READINESS={};
  (readiness||[]).forEach(r=>{
    if(!T_READINESS[r.user_id]) T_READINESS[r.user_id]={};
    T_READINESS[r.user_id][r.subject]=r;
  });

  // Grade entries
  const{data:grades}=await db.from('grade_entries').select('user_id,subject,unit_name,grade_letter,grade_num,readiness,created_at').in('user_id',studentIds).order('created_at',{ascending:false});
  T_GRADES={};
  (grades||[]).forEach(g=>{
    if(!T_GRADES[g.user_id]) T_GRADES[g.user_id]=[];
    T_GRADES[g.user_id].push(g);
  });

  // Quiz attempts
  const{data:quizzes}=await db.from('quiz_attempts').select('user_id,subject,score,total,pct,created_at').in('user_id',studentIds).order('created_at',{ascending:false});
  T_QUIZZES={};
  (quizzes||[]).forEach(q=>{
    if(!T_QUIZZES[q.user_id]) T_QUIZZES[q.user_id]=[];
    T_QUIZZES[q.user_id].push(q);
  });
}

function tOverallLevel(uid){
  const r=T_READINESS[uid];
  if(!r||!Object.keys(r).length) return 'none';
  const lvls=Object.values(r).map(v=>v.level);
  if(lvls.some(l=>l==='red')) return 'red';
  if(lvls.every(l=>l==='green')) return 'green';
  return 'yellow';
}

function tLevelPill(level, score=null){
  const map={green:'🟢 On track',yellow:'⚠️ Needs work',red:'🔴 At risk',none:'— No data'};
  const cls={green:'badge g',yellow:'badge y',red:'badge r',none:'badge'};
  return `<span class="${cls[level]||'badge'}">${map[level]||'—'}${score!==null&&level!=='none'?' · '+score+'%':''}</span>`;
}

  const subjLabels={biology:'Living Environment',algebra:'Algebra I',ela:'ELA',history:'US History'};
  const quizSubjLabels={bio:'Biology',alg:'Algebra',ela:'ELA',ush:'US History',sat:'SAT',mock:'Mock'};
  const avgQ=quizzes.length?Math.round(quizzes.reduce((a,q)=>a+(q.pct||0),0)/quizzes.length):null;

  document.getElementById('tStudentDetail').innerHTML=`
    <div class="card" style="border:2px solid var(--teal);margin-top:16px;" id="tDetail_${uid}">

            Object.entries(readiness).map(([subj,r])=>`
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:6px;background:${r.level==='green'?'#f0fdf4':r.level==='yellow'?'#fffbeb':'#fff1f2'};border:1px solid ${r.level==='green'?'#bbf7d0':r.level==='yellow'?'#fde68a':'#fecdd3'};">

async function pgClassrooms(){
  const{data:rooms}=await db.from('classrooms').select('*, classroom_students(student_id)').eq('teacher_id',USER.id);
  const roomList=rooms||[];

  set(`<div class="page">
    <div class="page-title">🏫 My Classrooms</div>
    <div class="page-sub">Create classes and share the code with your students</div>

    <div class="section">
      <div class="sec-head">Create New Class</div>
      <div class="irow">
        <input class="finp" id="cName" placeholder="Class name e.g. Period 3 — Living Environment" style="max-width:300px">
        <select class="finp" id="cSubj" style="max-width:180px">
          <option value="">All subjects</option>
          <option value="biology">Living Environment</option>
          <option value="algebra">Algebra I</option>
          <option value="ela">ELA</option>
          <option value="history">US History</option>
        </select>
        <button class="btn-black" onclick="tCreateClass()">Create Class →</button>
      </div>
    </div>

    <div id="roomListWrap">
      ${roomList.length===0?'<div class="section"><div class="empty-box"><h3>No classrooms yet</h3><p>Create your first class above.</p></div></div>':
        roomList.map(r=>`
          <div class="section">
            <div class="sec-head">${H(r.name)} <span style="font-weight:500;color:var(--gray);font-size:13px;">${H(r.subject||'All subjects')}</span></div>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
              <div style="background:var(--black);color:white;padding:10px 20px;border-radius:10px;font-size:22px;font-weight:800;letter-spacing:5px;font-family:monospace;">${r.code||'——'}</div>
              <div>
                <div style="font-size:13px;font-weight:700;margin-bottom:2px;">${r.classroom_students?.length||0} students enrolled</div>
                <div style="font-size:12px;color:var(--gray);">Share this code → students join at <strong>/join.html</strong></div>
              </div>
              <button onclick="navigator.clipboard.writeText('${r.code}').then(()=>toast('Code copied! ✓','success'))" class="btn-teal" style="padding:8px 16px;font-size:13px;">📋 Copy code</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  </div>`);
}

async function tCreateClass(){
  const name=document.getElementById('cName')?.value?.trim();
  const subj=document.getElementById('cSubj')?.value;
  if(!name) return toast('Enter a class name','error');
  const{error}=await db.from('classrooms').insert({teacher_id:USER.id,name,subject:subj||null});
  if(error) return toast('Error: '+error.message,'error');
  toast('Class created! ✓','success');
  pgClassrooms();
}



// ── INIT ──
window.onload=async()=>{
  if(typeof supabase==='undefined'){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('authScreen').style.display='flex';
    return;
  }
  try{ db=supabase.createClient(SB_URL,SB_KEY); }catch(e){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('authScreen').style.display='flex';
    return;
  }
  const t=setTimeout(()=>{
    document.getElementById('loader').classList.add('hide');
    document.getElementById('authScreen').style.display='flex';
  },5000);
  try{
    const{data}=await db.auth.getSession();
    clearTimeout(t);
    if(data?.session?.user) await enterApp(data.session.user);
    else{ document.getElementById('loader').classList.add('hide'); document.getElementById('authScreen').style.display='flex'; }
  }catch(e){ clearTimeout(t); document.getElementById('loader').classList.add('hide'); document.getElementById('authScreen').style.display='flex'; }

  db.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT') location.reload();
  });

  // Enter key on sign in
  document.getElementById('inPass')?.addEventListener('keydown',e=>{ if(e.key==='Enter') doSignIn(); });
};
</script>
