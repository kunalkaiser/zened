<!DOCTYPE html>
<html lang="en">
<head>

<title>Tutor Profile | ZenEd</title>

<style>
:root{
  --ink:#0d1117;--cream:#f5f3ef;--white:#fff;
  --teal:#0ea87a;--teal-dark:#0b8f68;--teal-pale:#e6f5f0;
  --amber:#d97706;--amber-pale:#fef3c7;
  --border:#e2ddd6;--gray:#78716c;--gray-light:#f7f5f2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);}
.nav{height:56px;background:var(--ink);display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:300;}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:white;font-weight:700;font-size:15px;}
.logo-ico{width:26px;height:26px;background:linear-gradient(135deg,#0ea87a,#076b4f);border-radius:6px;display:flex;align-items:center;justify-content:center;}
.logo em{color:var(--teal);font-style:normal;}
.nav-links{margin-left:auto;display:flex;gap:6px;align-items:center;}
.nav-link{font-size:13px;color:rgba(255,255,255,.55);text-decoration:none;padding:6px 10px;font-weight:600;}
.nav-link:hover{color:white;}
.nav-cta{font-size:13px;font-weight:700;color:var(--ink);background:var(--teal);padding:7px 16px;border-radius:100px;text-decoration:none;}

/* LAYOUT */
.page{max-width:900px;margin:0 auto;padding:40px 24px 80px;}
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;}

/* LEFT — PROFILE CARD */
.profile-card{background:white;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.profile-header{background:var(--ink);padding:32px 28px;display:flex;gap:20px;align-items:flex-start;}
.avatar{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,#0ea87a,#076b4f);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:28px;color:white;flex-shrink:0;}
.ph-info{flex:1;}
.tutor-name{font-family:'Fraunces',serif;font-size:28px;color:white;letter-spacing:-.3px;line-height:1.1;margin-bottom:6px;}
.tutor-location{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:10px;}
.style-tags{display:flex;flex-wrap:wrap;gap:6px;}
.style-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);}
.verified-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(14,168,122,.2);border:1px solid rgba(14,168,122,.3);color:#4ade80;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-top:10px;}

.profile-body{padding:28px;}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray);margin-bottom:10px;}
.bio-text{font-size:14px;color:#374151;line-height:1.8;margin-bottom:24px;}
.specialty-box{background:var(--teal-pale);border-radius:12px;padding:14px 16px;margin-bottom:24px;display:flex;gap:10px;align-items:flex-start;}
.spec-ico{font-size:18px;flex-shrink:0;}
.spec-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--teal-dark);margin-bottom:3px;}
.spec-text{font-size:13px;font-weight:600;color:var(--ink);}

/* SUBJECTS */
.subjects-wrap{margin-bottom:24px;}
.subject-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.subj-tag{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--gray-light);color:var(--ink);border:1px solid var(--border);}
.subj-tag.hot{background:#dcfce7;color:#166534;border-color:#bbf7d0;}

/* GRADES / AVAILABILITY */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;}
.meta-item{background:var(--gray-light);border-radius:12px;padding:14px;}
.mi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:8px;}
.mi-tags{display:flex;flex-wrap:wrap;gap:5px;}
.mi-tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;background:white;border:1px solid var(--border);}

/* REVIEWS PLACEHOLDER */
.reviews-section{border-top:1px solid var(--border);padding-top:20px;}
.no-reviews{font-size:13px;color:var(--gray);text-align:center;padding:20px;font-style:italic;}

/* RIGHT — BOOKING PANEL */
.booking-panel{background:white;border:1px solid var(--border);border-radius:20px;padding:24px;position:sticky;top:72px;}
.rate-display{text-align:center;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.rate-big{font-family:'Fraunces',serif;font-size:44px;font-style:italic;color:var(--teal);line-height:1;}
.rate-unit{font-size:12px;color:var(--gray);margin-top:3px;}
.avail-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:8px;}
.avail-chips{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
.avail-chip{font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px;background:var(--teal-pale);color:var(--teal-dark);display:flex;align-items:center;gap:7px;}
.btn-book{width:100%;padding:14px;background:var(--teal);color:white;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px;}
.btn-book:hover{background:var(--teal-dark);}
.btn-msg{width:100%;padding:13px;background:white;color:var(--ink);border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-msg:hover{border-color:var(--ink);}
.booking-note{font-size:11px;color:var(--gray);text-align:center;margin-top:12px;line-height:1.6;}
.conflict-notice{background:var(--amber-pale);border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:11px;color:#92400e;line-height:1.6;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:20px;padding:32px;max-width:460px;width:90%;position:relative;}
.modal-title{font-family:'Fraunces',serif;font-size:24px;margin-bottom:8px;}
.modal-sub{font-size:13px;color:var(--gray);margin-bottom:20px;line-height:1.6;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;}
input[type=text],input[type=email],select,textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--teal);}
textarea{resize:none;min-height:80px;}
.btn-submit{width:100%;padding:13px;background:var(--teal);color:white;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-submit:hover{background:var(--teal-dark);}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray);}
.success-msg{text-align:center;padding:20px 0;}
.success-msg .ico{font-size:40px;margin-bottom:12px;}
.success-msg p{font-size:14px;color:var(--gray);line-height:1.7;}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:white;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:600;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;}
.toast.show{opacity:1;transform:translateY(0);}

@media(max-width:720px){
  .layout{grid-template-columns:1fr;}
  .booking-panel{position:static;}
  .meta-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>
// Sample tutor data — in production this would load from Supabase by tutor ID
const DEMO_TUTOR = {
  id: 'demo-001',
  first_name: 'Marcus',
  last_name: 'T.',
  borough: 'Brooklyn',
  years_teaching: '6–10 years',
  bio: "I've been teaching Living Environment and Earth Science at a Brooklyn high school for 8 years. I specialize in helping students who've failed or are at risk of failing their Regents — particularly in genetics, ecology, and lab practical skills. I bring the same energy to tutoring that I bring to my classroom.",
  specialty: "Making genetics and evolution click for students who think they just don't get science",
  grade_levels: ['9-10','11-12'],
  availability: ['weekday-after','weekend-morning'],
  hourly_rate: 65,
  teaching_styles: ['patient-methodical','test-focused'],
  status: 'active'
};

const AVAIL_LABELS = {
  'weekday-after': '🌆 Weekdays after 3pm',
  'weekend-morning': '🌅 Weekend mornings',
  'weekend-afternoon': '☀️ Weekend afternoons'
};

const STYLE_LABELS = {
  'patient-methodical': '🧘 Patient & methodical',
  'fast-rigorous': '⚡ Fast-paced',
  'test-focused': '🎯 Test-focused',
  'encouraging': '💪 Encouraging'
};

const HOT_SUBJECTS = ['Living Environment','Algebra I','ELA','US History','SHSAT Math','SHSAT ELA'];

function loadProfile(tutor) {
  const td = tutor;
  document.getElementById('profileName').textContent = td.first_name + ' ' + td.last_name;
  document.getElementById('profileLocation').textContent = td.borough + ', NYC · ' + td.years_teaching + ' teaching';
  document.getElementById('profileBio').textContent = td.bio;
  document.getElementById('profileSpecialty').textContent = td.specialty;
  document.getElementById('profileYears').textContent = td.years_teaching;
  document.getElementById('panelRate').textContent = '$' + td.hourly_rate;
  document.getElementById('avatarEl').textContent = td.first_name[0];
  document.title = td.first_name + ' ' + td.last_name + ' | ZenEd Tutor';

  // Style tags
  const styleTags = document.getElementById('styleTags');
  (td.teaching_styles || []).forEach(s => {
    const span = document.createElement('span');
    span.className = 'style-tag';
    span.textContent = STYLE_LABELS[s] || s;
    styleTags.appendChild(span);
  });

  // Subjects
  const subjectTags = document.getElementById('subjectTags');
  (td.subjects || []).forEach(s => {
    const span = document.createElement('span');
    span.className = 'subj-tag' + (HOT_SUBJECTS.includes(s) ? ' hot' : '');
    span.textContent = s;
    subjectTags.appendChild(span);
  });

  // Grade levels
  const gradeTags = document.getElementById('gradeTags');
  (td.grade_levels || []).forEach(g => {
    const span = document.createElement('span');
    span.className = 'mi-tag';
    span.textContent = 'Grades ' + g;
    gradeTags.appendChild(span);
  });

  // Availability
  const availChips = document.getElementById('availChips');
  (td.availability || []).forEach(a => {
    const div = document.createElement('div');
    div.className = 'avail-chip';
    div.textContent = AVAIL_LABELS[a] || a;
    availChips.appendChild(div);
  });

  // Populate booking modal subjects
  const bookSubject = document.getElementById('bookSubject');
  (td.subjects || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    bookSubject.appendChild(opt);
  });

  // Populate booking modal times
  const bookTime = document.getElementById('bookTime');
  (td.availability || []).forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = AVAIL_LABELS[a] || a;
    bookTime.appendChild(opt);
  });

  // Set modal tutor names
  document.querySelectorAll('#modalTutorName,#modalTutorName2,#msgTutorName,#msgTutorName2')
    .forEach(el => el.textContent = td.first_name + ' ' + td.last_name);
}

function openBooking() {
  document.getElementById('bookModal').classList.add('open');
  document.getElementById('bookForm').style.display = 'block';
  document.getElementById('bookSuccess').style.display = 'none';
}

function openMessage() {
  document.getElementById('msgModal').classList.add('open');
  document.getElementById('msgForm').style.display = 'block';
  document.getElementById('msgSuccess').style.display = 'none';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function submitBooking() {
  const name = document.getElementById('bookName').value.trim();
  const email = document.getElementById('bookEmail').value.trim();
  const subj = document.getElementById('bookSubject').value;
  const time = document.getElementById('bookTime').value;
  if (!name || !email || !subj || !time) { toast('Please fill in all required fields'); return; }
  document.getElementById('bookForm').style.display = 'none';
  document.getElementById('bookSuccess').style.display = 'block';
}

function submitMessage() {
  const name = document.getElementById('msgName').value.trim();
  const email = document.getElementById('msgEmail').value.trim();
  const msg = document.getElementById('msgText').value.trim();
  if (!name || !email || !msg) { toast('Please fill in all fields'); return; }
  document.getElementById('msgForm').style.display = 'none';
  document.getElementById('msgSuccess').style.display = 'block';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 2800);
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// Load profile on page load
// In production: parse ?id= from URL and fetch from Supabase tutor_applications table
// For now load demo tutor
loadProfile(DEMO_TUTOR);
</script>
</body>
